name: Revival validation
on:
  push:
    branches: [validation/revival-20261101]
permissions:
  contents: read
jobs:
  validate:
    name: PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 49598
            ref: eacacd4446bcd3b5886e2b683d80c68f71270fff
            tests: tests/unit/proxy/middleware/test_litellm_response_headers_middleware.py
          - pr: 49599
            ref: 0530ebee46ba673d7da869bd1a541f5c994d85f1
            tests: tests/unit/llms/custom_httpx/test_raw_body_surrogates.py
          - pr: 49601
            ref: 3687b4aff1243b965568f345b6dbc282b7a56a44
            tests: tests/unit/proxy/common_utils/test_callback_lifecycle.py tests/unit/proxy/guardrails/guardrail_hooks/test_presidio.py tests/unit/llms/custom_httpx/test_async_client_cleanup.py
    env:
      BASE_REF: 60fc121ce8ab995cb2997e0bbd0a980ee93c627d
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact base
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Install runtime and lint dependencies
        run: |
          uv sync --inexact --frozen --extra proxy --group proxy-dev --group e2e-dev
          uv run --no-sync python scripts/prisma_generate_if_needed.py
      - name: All repository lint checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -k -j 1 BASE_REF="$BASE_REF" LINT_DEP_INSTALL= LINT_E2E_DEP_INSTALL= LINT_DEP_BASE= lint-checks
      - name: Regression and CI coverage tests
        if: always()
        run: uv run --no-sync pytest ${{ matrix.tests }} tests/unit/test_assert_ci_coverage.py -q
